# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# instruction_following.yaml — 25 tests, all deterministic (no llm-rubric).
# Usage in promptfooconfig.yaml:
#   prompts:
#     - '{{input}}'
#   tests: file://instruction_following.yaml
# Note: defaultTest in promptfooconfig.yaml still applies (e.g. its llm-rubric).
# Written by Gemini 3.8 Flash, Formatted by Claude Sonnet 5.5
 
# ---------- word_count ----------
- description: 'IF-01 exact word count 12'
  vars:
    input: 'Describe rain in exactly 12 words.'
  metadata:
    category: instruction_following
    constraint: word_count
    difficulty: medium
    requirements:
      - exactly 12 whitespace-separated words
  assert:
    - type: javascript
      value: 'output.trim().split(/\s+/).length === 12'
 
- description: 'IF-02 maximum word count 8'
  vars:
    input: 'Give one tip for saving energy at home. Use no more than 8 words.'
  metadata:
    category: instruction_following
    constraint: word_count
    difficulty: easy
    requirements:
      - non-empty
      - at most 8 words
  assert:
    - type: javascript
      value: 'output.trim().length > 0 && output.trim().split(/\s+/).length <= 8'
 
- description: 'IF-03 minimum word count 20'
  vars:
    input: 'Explain why birds migrate during the autumn season. Your response must contain at least 20 words.'
  metadata:
    category: instruction_following
    constraint: word_count
    difficulty: easy
    requirements:
      - at least 20 words
  assert:
    - type: javascript
      value: 'output.trim().split(/\s+/).length >= 20'
 
# ---------- sentence_count ----------
- description: 'IF-04 exact sentence count 1'
  vars:
    input: 'Define what a telescope does. Write exactly 1 sentence.'
  metadata:
    category: instruction_following
    constraint: sentence_count
    difficulty: easy
    requirements:
      - exactly 1 sentence (split on whitespace after . ! ?)
  assert:
    - type: javascript
      value: 'output.trim().length > 0 && output.trim().split(/(?<=[.!?])\s+/).length === 1'
 
- description: 'IF-05 exact sentence count 2'
  vars:
    input: 'Explain how bicycles stay upright when moving. Write exactly 2 sentences.'
  metadata:
    category: instruction_following
    constraint: sentence_count
    difficulty: easy
    requirements:
      - exactly 2 sentences
  assert:
    - type: javascript
      value: 'output.trim().split(/(?<=[.!?])\s+/).length === 2'
 
- description: 'IF-06 exact sentence count 3'
  vars:
    input: 'Write exactly 3 sentences about trains and how they travel.'
  metadata:
    category: instruction_following
    constraint: sentence_count
    difficulty: medium
    requirements:
      - exactly 3 sentences
  assert:
    - type: javascript
      value: 'output.trim().split(/(?<=[.!?])\s+/).length === 3'
 
# ---------- forbidden_word_or_letter ----------
- description: 'IF-07 forbidden letter z'
  vars:
    input: 'Describe an afternoon at a park. Do not use the letter "z" or "Z" anywhere in your response.'
  metadata:
    category: instruction_following
    constraint: forbidden_word_or_letter
    difficulty: easy
    requirements:
      - no "z" or "Z"
      - non-empty
  assert:
    - type: not-regex
      value: '[zZ]'
    - type: javascript
      value: 'output.trim().length > 0'
 
- description: 'IF-08 forbidden word delicious'
  vars:
    input: 'Write a short positive review of a bakery. Do not use the word "delicious" anywhere in your response.'
  metadata:
    category: instruction_following
    constraint: forbidden_word_or_letter
    difficulty: medium
    requirements:
      - does not contain "delicious" (case-insensitive)
      - non-empty
  assert:
    - type: not-icontains
      value: 'delicious'
    - type: javascript
      value: 'output.trim().length > 0'
 
# ---------- required_word_or_phrase ----------
- description: 'IF-09 required phrase spaced repetition'
  vars:
    input: 'Share a tip for studying effectively. You must include the phrase "spaced repetition" in your answer.'
  metadata:
    category: instruction_following
    constraint: required_word_or_phrase
    difficulty: easy
    requirements:
      - contains "spaced repetition" (case-insensitive)
  assert:
    - type: icontains
      value: 'spaced repetition'
 
- description: 'IF-10 required word lantern twice'
  vars:
    input: 'Write a brief description of a dark campsite. Include the word "lantern" exactly twice.'
  metadata:
    category: instruction_following
    constraint: required_word_or_phrase
    difficulty: medium
    requirements:
      - the whole word "lantern" appears exactly 2 times (case-insensitive; "lanterns" does not count)
  assert:
    - type: javascript
      value: '(output.toLowerCase().match(/\blantern\b/g) || []).length === 2'
 
# ---------- start_end_text ----------
- description: 'IF-11 start text Announcement:'
  vars:
    input: 'Write an announcement about library hours changing. Start your response with "Announcement:".'
  metadata:
    category: instruction_following
    constraint: start_end_text
    difficulty: easy
    requirements:
      - first characters are "Announcement:" (leading whitespace ignored)
  assert:
    - type: javascript
      value: 'output.trim().startsWith("Announcement:")'
 
- description: 'IF-12 end text Stay safe on the trail!'
  vars:
    input: 'Share safety advice for hiking in the mountains. Your response must end with "Stay safe on the trail!"'
  metadata:
    category: instruction_following
    constraint: start_end_text
    difficulty: easy
    requirements:
      - last characters are "Stay safe on the trail!" (trailing whitespace ignored)
  assert:
    - type: javascript
      value: 'output.trim().endsWith("Stay safe on the trail!")'
 
- description: 'IF-13 start Dear team and end Regards'
  vars:
    input: 'Write a short message to colleagues about upcoming maintenance. Begin with "Dear team," and end with "Regards."'
  metadata:
    category: instruction_following
    constraint: start_end_text
    difficulty: medium
    requirements:
      - starts with "Dear team,"
      - ends with "Regards."
  assert:
    - type: javascript
      value: 'output.trim().startsWith("Dear team,")'
    - type: javascript
      value: 'output.trim().endsWith("Regards.")'
 
# ---------- format_list ----------
- description: 'IF-14 format list 3 bullet points'
  vars:
    input: 'List 3 benefits of regular walking. Reply with exactly 3 bullet points, each starting with "- ".'
  metadata:
    category: instruction_following
    constraint: format_list
    difficulty: easy
    requirements:
      - exactly 3 non-blank lines
      - every non-blank line starts with "- "
  assert:
    - type: javascript
      value: '((l) => l.length === 3 && l.every(s => s.startsWith("- ")))(output.trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean))'
 
- description: 'IF-15 format list 4 bullet points'
  vars:
    input: 'Name 4 items commonly found in a pencil case. Reply with exactly 4 bullet points, each starting with "- ".'
  metadata:
    category: instruction_following
    constraint: format_list
    difficulty: medium
    requirements:
      - exactly 4 non-blank lines
      - every non-blank line starts with "- "
  assert:
    - type: javascript
      value: '((l) => l.length === 4 && l.every(s => s.startsWith("- ")))(output.trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean))'
 
- description: 'IF-16 format list 5 numbered steps'
  vars:
    input: 'List 5 steps to brew hot tea. Number each item sequentially from 1 to 5, with each step on a new line starting with "1. ", "2. ", and so on.'
  metadata:
    category: instruction_following
    constraint: format_list
    difficulty: medium
    requirements:
      - exactly 5 non-blank lines
      - line N starts with "N. " for N = 1..5
  assert:
    - type: javascript
      value: '((l) => l.length === 5 && l.every((s, i) => s.startsWith((i + 1) + ". ")))(output.trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean))'
 
# ---------- case_format ----------
- description: 'IF-17 case format lowercase'
  vars:
    input: 'Explain why the ocean has tides. Write entirely in lowercase letters with no uppercase characters.'
  metadata:
    category: instruction_following
    constraint: case_format
    difficulty: medium
    requirements:
      - no uppercase characters
      - contains at least one letter
  assert:
    - type: javascript
      value: 'output === output.toLowerCase() && /[a-z]/.test(output)'
 
- description: 'IF-18 case format uppercase'
  vars:
    input: 'Write an emergency alert warning residents about flash flooding. Write your entire response in ALL CAPS with no lowercase letters.'
  metadata:
    category: instruction_following
    constraint: case_format
    difficulty: medium
    requirements:
      - no lowercase characters
      - contains at least one letter
  assert:
    - type: javascript
      value: 'output === output.toUpperCase() && /[A-Z]/.test(output)'
 
# ---------- output_only ----------
- description: 'IF-19 output only single word'
  vars:
    input: 'What is the primary gas found in Earth atmosphere? Reply with the single word only, no punctuation.'
  metadata:
    category: instruction_following
    constraint: output_only
    difficulty: medium
    requirements:
      - output is one alphabetic word, no punctuation
      - word is "nitrogen"
  assert:
    - type: regex
      value: '^\s*[A-Za-z]+\s*$'
    - type: icontains
      value: 'nitrogen'
 
- description: 'IF-20 output only single number'
  vars:
    input: 'How many minutes are in one hour? Reply with the single number only, no words and no punctuation.'
  metadata:
    category: instruction_following
    constraint: output_only
    difficulty: easy
    requirements:
      - output is digits only
      - value is 60
  assert:
    - type: regex
      value: '^\s*\d+\s*$'
    - type: javascript
      value: 'output.trim() === "60"'
 
# ---------- combination ----------
- description: 'IF-21 combination word count and forbidden letter'
  vars:
    input: 'Describe a forest in exactly 10 words. Do not use the letter "z" or "Z" anywhere in your response.'
  metadata:
    category: instruction_following
    constraint: combination
    difficulty: hard
    requirements:
      - exactly 10 words
      - no "z" or "Z"
    compliant_sample: 'Tall green pine trees grow quietly across the damp soil.'
    non_compliant_sample: 'A buzzing breeze blows softly through the quiet misty morning forest.'
  assert:
    - type: javascript
      value: 'output.trim().split(/\s+/).length === 10'
    - type: not-regex
      value: '[zZ]'
 
- description: 'IF-22 combination uppercase and word count'
  vars:
    input: 'Issue an urgent warning to evacuate a building. Write entirely in ALL CAPS and use no more than 8 words.'
  metadata:
    category: instruction_following
    constraint: combination
    difficulty: hard
    requirements:
      - no lowercase characters
      - at most 8 words
    compliant_sample: 'EVACUATE THE BUILDING IMMEDIATELY THROUGH NEAREST EXIT!'
    non_compliant_sample: 'Please evacuate the building immediately through the nearest marked fire exit right now.'
  assert:
    - type: javascript
      value: 'output === output.toUpperCase() && /[A-Z]/.test(output)'
    - type: javascript
      value: 'output.trim().length > 0 && output.trim().split(/\s+/).length <= 8'
 
- description: 'IF-23 combination bullet list and forbidden word'
  vars:
    input: 'List 3 ways to reduce household waste. Reply with exactly 3 bullet points, each starting with "- ", and do not use the word "plastic" anywhere in your response.'
  metadata:
    category: instruction_following
    constraint: combination
    difficulty: hard
    requirements:
      - exactly 3 non-blank lines, each starting with "- "
      - does not contain "plastic" (case-insensitive)
    compliant_sample: "- Compost organic kitchen scraps\n- Bring reusable cloth shopping bags\n- Repair worn garments before replacing"
    non_compliant_sample: "- Stop buying single-use plastic bottles\n- Recycle plastic packaging containers"
  assert:
    - type: javascript
      value: '((l) => l.length === 3 && l.every(s => s.startsWith("- ")))(output.trim().split(/\r?\n/).map(s => s.trim()).filter(Boolean))'
    - type: not-icontains
      value: 'plastic'
 
- description: 'IF-24 combination lowercase with start and end text'
  vars:
    input: 'Write a brief greeting and farewell to a visitor. Write entirely in lowercase letters, begin your response with "welcome," and end with "goodbye."'
  metadata:
    category: instruction_following
    constraint: combination
    difficulty: hard
    requirements:
      - no uppercase characters
      - starts with "welcome,"
      - ends with "goodbye."
    compliant_sample: 'welcome, enjoy exploring every neighborhood of our town today; goodbye.'
    non_compliant_sample: 'Welcome, enjoy exploring every neighborhood of our town today; Goodbye.'
  assert:
    - type: javascript
      value: 'output === output.toLowerCase()'
    - type: javascript
      value: 'output.trim().startsWith("welcome,")'
    - type: javascript
      value: 'output.trim().endsWith("goodbye.")'
 
- description: 'IF-25 combination word count and required phrase'
  vars:
    input: 'Describe a modern wind farm using exactly 15 words. You must include the phrase "renewable energy" in your description.'
  metadata:
    category: instruction_following
    constraint: combination
    difficulty: hard
    requirements:
      - exactly 15 words
      - contains "renewable energy" (case-insensitive)
    compliant_sample: 'Giant white turbines spin across open fields, generating clean renewable energy for modern coastal towns.'
    non_compliant_sample: 'Wind turbines generate clean electricity when air moves across large blades on tall towers.'
  assert:
    - type: javascript
      value: 'output.trim().split(/\s+/).length === 15'
    - type: icontains
      value: 'renewable energy'
 