- description: RS-06 hard - epistemic puzzle with private information
  vars:
    input: 'Alice and Bob each have a number. They know the sum of their numbers is
      either 2 or 3.

      Alice says: "I don''t know what Bob''s number is."

      Bob then says: "I don''t know what Alice''s number is."

      Alice then says: "Now I know Bob''s number."

      What is Bob''s number?

      Think step by step, then finish with a final line "ANSWER: <answer>".

      '
  metadata:
    category: reasoning
    subtype: epistemic
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: 'const norm = output.normalize(''NFKC'');

      const answer = (norm.match(/ANSWER:\s*([^\n]+)/gi) || []).pop()?.replace(/^ANSWER:\s*/i,
      '''').trim().toLowerCase();

      // Possible pairs: (0,2), (1,1), (2,0), (0,3), (1,2), (2,1), (3,0)

      // If sum is 2: (0,2), (1,1), (2,0)

      // If sum is 3: (0,3), (1,2), (2,1), (3,0)

      // Alice doesn''t know Bob''s number -> Alice doesn''t have 0 or 3 (because
      if Alice had 0, Bob must have 2 or 3; if Alice had 3, Bob must have 0)

      // Wait, that''s not right. If Alice has 0 and sum is 2, Bob has 2. If sum is
      3, Bob has 3.

      // So Alice doesn''t know -> Alice doesn''t have 0 or 3? No, Alice could have
      0 and not know if sum is 2 or 3.

      // Actually: If Alice has 1, and sum is 2, Bob has 1. If sum is 3, Bob has 2.
      So Alice doesn''t know.

      // If Alice has 2, and sum is 2, Bob has 0. If sum is 3, Bob has 1. So Alice
      doesn''t know.

      // If Alice has 0, and sum is 2, Bob has 2. If sum is 3, Bob has 3. So Alice
      doesn''t know.

      // If Alice has 3, and sum is 3, Bob has 0. Sum can''t be 2 if Alice has 3.
      So Alice WOULD know Bob has 0.

      // So Alice doesn''t have 3.

      // Similarly, Alice doesn''t have 0? No, Alice could have 0.

      // Actually, let me reconsider. The sum is EITHER 2 or 3, not both.

      // If Alice has 0: sum must be 2 or 3, so Bob has 2 or 3. Alice doesn''t know.

      // If Alice has 1: sum must be 2 or 3, so Bob has 1 or 2. Alice doesn''t know.

      // If Alice has 2: sum must be 2 or 3, so Bob has 0 or 1. Alice doesn''t know.

      // If Alice has 3: sum must be 3 (can''t be 2), so Bob has 0. Alice KNOWS.

      // So Alice doesn''t have 3.

      // Similarly, Bob doesn''t have 3.

      // Now Bob says he doesn''t know. This means Bob doesn''t have 3 either (same
      reasoning).

      // Now Alice knows Bob''s number. If Alice has 2, and sum is 2 or 3:

      //   - If sum is 2, Bob has 0

      //   - If sum is 3, Bob has 1

      // But Bob said he doesn''t know, which means Bob doesn''t have 3. This doesn''t
      help Alice.

      // If Alice has 1, and sum is 2 or 3:

      //   - If sum is 2, Bob has 1

      //   - If sum is 3, Bob has 2

      // Bob said he doesn''t know. If Bob had 1, he would know Alice has 1 (sum 2)
      or 2 (sum 3). So Bob wouldn''t know.

      // If Bob had 2, he would know Alice has 0 (sum 2) or 1 (sum 3). So Bob wouldn''t
      know.

      // This doesn''t help.

      // If Alice has 0, and sum is 2 or 3:

      //   - If sum is 2, Bob has 2

      //   - If sum is 3, Bob has 3

      // But we know Bob doesn''t have 3 (from his statement). So sum must be 2 and
      Bob has 2.

      // Therefore Alice has 0 and Bob has 2.

      return answer === ''2'' || answer === ''bob has 2'';

      '
