- description: RS-01 adversarial - false premise challenge
  vars:
    input: |
      If the lights are on, then someone is home.
      The lights are on.
      Therefore, someone is home.

      Identify the logical fallacy committed by this argument, or explain if it is valid.
      Think step by step, then finish with a final line "ANSWER: <answer>".
  metadata:
    category: reasoning
    subtype: logical_fallacy
    difficulty: adversarial
    boundary: determinate
    dimension: adversarial
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
