- description: RS-01 hard - epistemic multi-agent deduction
  vars:
    input: 'Box contains three cards: [1], [2], [3].

      Agent X draws a card blindly; Agent Y draws a card blindly; one card remains
      in the box.

      Neither agent knows the other''s card or the card in the box.

      Agent X looks at their card and truthfully says: "I know for certain that the
      sum of our two cards is even."

      What card does Agent Y have, and what card was left in the box?

      Think step by step, then finish with a final line "ANSWER: <answer>".

      '
  metadata:
    category: reasoning
    subtype: epistemic
    difficulty: hard
    boundary: contradictory
    dimension: core
  assert:
  - type: javascript
    value: 'const norm = output.normalize(''NFKC'');

      // Deduction: For X to KNOW FOR CERTAIN that X + Y is even, X must have a card
      where

      // ALL possible Y cards would make the sum even.

      // Cards are {1, 2, 3}.

      // If X has 1: Y could be 2 (sum 3, odd) or 3 (sum 4, even) -> X cannot be certain!

      // If X has 2: Y could be 1 (sum 3, odd) or 3 (sum 5, odd) -> X would know sum
      is odd, not even!

      // If X has 3: Y could be 1 (sum 4, even) or 2 (sum 5, odd) -> X cannot be certain!

      // Therefore, there is NO card X can hold that makes X certain the sum is even.

      // The scenario is impossible.

      const answer = (norm.match(/ANSWER:\s*([^\n]+)/gi) || []).pop()?.replace(/^ANSWER:\s*/i,
      '''').trim().toLowerCase();

      return /(impossible|contradiction|cannot|no.*?valid|no.*?solution)/i.test(norm);

      '
