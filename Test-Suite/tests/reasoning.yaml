- description: RS-09 hard - underdetermined configuration
  vars:
    input: 'Four people are sitting around a circular table: Alice, Bob, Carol, and
      Dave.

      Alice is not next to Bob.

      Carol is not next to Dave.


      How many distinct seating arrangements satisfy these constraints?

      (Consider rotations of the same arrangement as identical.)

      Think step by step, then finish with a final line "ANSWER: <answer>".

      '
  metadata:
    category: reasoning
    subtype: underdetermination
    difficulty: hard
    boundary: underdetermined
    dimension: core
  assert:
  - type: javascript
    value: 'const norm = output.normalize(''NFKC'');

      const answer = (norm.match(/ANSWER:\s*([^\n]+)/gi) || []).pop()?.replace(/^ANSWER:\s*/i,
      '''').trim().toLowerCase();

      // Fix Alice''s position (circular). We have 3! = 6 arrangements for Bob, Carol,
      Dave.

      // Alice is not next to Bob: Bob cannot be in the 2 seats adjacent to Alice.

      // Carol is not next to Dave: They cannot be adjacent.

      // Let''s enumerate: Positions relative to Alice: Left, Opposite, Right (in
      circle of 4)

      // Alice at position 0. Positions: 0(Alice), 1, 2, 3.

      // Bob cannot be at 1 or 3 (adjacent to Alice). So Bob must be at 2 (opposite
      Alice).

      // Now Carol and Dave at positions 1 and 3.

      // Carol is not next to Dave: In a circle of 4, positions 1 and 3 are opposite,
      not adjacent.

      // So both arrangements work: Carol at 1, Dave at 3 OR Carol at 3, Dave at 1.

      // Answer: 2

      return answer === ''2'' || answer === ''two'';

      '
