# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Reference from promptfooconfig.yaml via:  tests: file://reasoning.yaml

- description: 'RS-01 transitive height ordering'
  vars:
    input: 'Amy is taller than Ben. Ben is taller than Chris. Who is the tallest? Think step by step, then finish with a final line "ANSWER: <answer>".'
  metadata:
    category: reasoning
    subtype: ordering_transitive
    difficulty: easy
  assert:
    - type: regex
      value: '\bamy\b'
      transform: "(output.normalize('NFKC').match(/ANSWER:\\s*([^\\n]+)/gi) || []).pop()?.replace(/^ANSWER:\\s*/i, '').replace(/^[.*\"'\\s]+|[.*\"'\\s]+$/g, '').toLowerCase()"

