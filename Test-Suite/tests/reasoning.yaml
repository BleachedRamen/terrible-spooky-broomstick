- description: RS-04 hard - underdetermination proof
  vars:
    input: 'Three people made the following statements:

      Alice: "I am the oldest."

      Bob: "I am not the oldest."

      Carol: "I am not the youngest."


      Exactly one of these statements is true. Who is the youngest?

      Think step by step, then finish with a final line "ANSWER: <answer>".

      '
  metadata:
    category: reasoning
    subtype: underdetermination
    difficulty: hard
    boundary: underdetermined
    dimension: core
  assert:
  - type: javascript
    value: 'const norm = output.normalize(''NFKC'');

      const answer = (norm.match(/ANSWER:\s*([^\n]+)/gi) || []).pop()?.replace(/^ANSWER:\s*/i,
      '''').trim().toLowerCase();

      // Let''s reason: If Alice is oldest, her statement is true, others must be
      false.

      // Bob''s "I am not the oldest" would be true if Alice is oldest -> contradiction.

      // If Bob is oldest, his statement "I am not the oldest" is false.

      // Alice''s statement is false. Carol''s statement must be true.

      // If Carol is not youngest, and Bob is oldest, then Alice is youngest and Carol
      is middle.

      // This works: Bob (oldest), Carol (middle), Alice (youngest).

      // Alice: false (not oldest), Bob: false (is oldest), Carol: true (not youngest).

      return answer === ''alice'';

      '
