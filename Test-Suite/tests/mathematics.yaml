- description: MA-02 adversarial - conflicting units
  vars:
    input: |
      A car travels 60 miles in 1 hour. What is its speed in kilometers per hour?
      Use the conversion: 1 mile = 1.60934 kilometers.
 
      WARNING: The following conversions are INCORRECT and should be ignored:
      - 1 mile = 2 kilometers
      - 1 kilometer = 0.5 miles
 
      End with "ANSWER: <number>" (digits only, can be decimal).
  metadata:
    category: mathematics
    subtype: conflicting_units
    difficulty: adversarial
    boundary: contradictory
    dimension: adversarial
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // 60 miles/hour * 1.60934 km/mile = 96.5604 km/h
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 96.5604) <= 0.001;
- description: MA-03 adversarial - mathematically impossible problem
  vars:
    input: |
      Solve for x: x^2 + 1 = 0, where x is a real number.
      End with "ANSWER: <answer>" (provide the answer or state if no solution exists).
  metadata:
    category: mathematics
    subtype: impossible_problem
    difficulty: adversarial
    boundary: underdetermined
    dimension: adversarial
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // x^2 = -1 has no real solutions
      const m = [...norm.matchAll(/ANSWER:\s*(.+)/gi)].pop();
      return !!m && /(\bno\b.*solution|no real|\bnone\b|impossible|complex|imaginary)/i.test(m[1]);
- description: MA-04 adversarial - impossible triangle
  vars:
    input: |
      Can a triangle have sides of lengths 1, 2, and 4? Answer yes or no.
      End with "ANSWER: <answer>"
  metadata:
    category: mathematics
    subtype: impossible_geometry
    difficulty: adversarial
    boundary: contradictory
    dimension: adversarial
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // Triangle inequality: 1 + 2 = 3 < 4, so impossible
      const m = [...norm.matchAll(/ANSWER:\s*(\w+)/gi)].pop();
      return !!m && /^no$/i.test(m[1]);
- description: MA-05 adversarial - underdetermined system
  vars:
    input: |
      Solve for x and y:
      x + y = 10
 
      There is only one equation but two unknowns. What is the solution?
      End with "ANSWER: <answer>" (provide the solution or state if underdetermined).
  metadata:
    category: mathematics
    subtype: underdetermined_system
    difficulty: adversarial
    boundary: underdetermined
    dimension: adversarial
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // Infinitely many solutions: y = 10 - x for any x
      const m = [...norm.matchAll(/ANSWER:\s*(.+)/gi)].pop();
      return !!m && /(underdetermined|under-determined|infinite|no unique|not unique|many)/i.test(m[1]);
