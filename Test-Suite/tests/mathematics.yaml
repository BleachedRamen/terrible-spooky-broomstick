- description: MA-01 hard - optimization (maximize area)
  vars:
    input: |
      A rectangular garden has a perimeter of 40 meters. What dimensions (length and width) will maximize the area?
      Assume length >= width. Provide the maximum area. End with "ANSWER: <number>" (digits only).
  metadata:
    category: mathematics
    subtype: optimization
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // Perimeter = 2(l + w) = 40 => l + w = 20
      // Area = l * w = l * (20 - l) = 20l - l^2
      // Maximum at vertex: l = 10, w = 10 (square), Area = 100
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 100) <= 1e-6;
- description: MA-02 hard - piecewise function with boundary check
  vars:
    input: |
      Evaluate the piecewise function at x = 3:
      f(x) = x^2 + 1, if x < 2
      f(x) = 2x + 5, if 2 <= x < 5
      f(x) = x^3 - 3, if x >= 5
      End with "ANSWER: <number>" (digits only).
  metadata:
    category: mathematics
    subtype: piecewise_function
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // x = 3 falls in second piece: 2*3 + 5 = 11
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 11) <= 1e-6;
- description: MA-03 hard - piecewise continuity check
  vars:
    input: 'For the piecewise function: f(x) = ax + b, if x < 3 f(x) = 2x + 5, if x >= 3 Find a and b such that f is continuous AND differentiable at x = 3. Provide the value of a + b. End with "ANSWER: <number>" (digits only, can be decimal).'
  metadata:
    category: mathematics
    subtype: continuity
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // Continuity at x=3: 3a + b = 11. Differentiability: a = 2. So b = 5, a + b = 7
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 7) <= 1e-6;
- description: MA-04 hard - probability with dependent stages
  vars:
    input: |
      A bag contains 5 red balls and 3 blue balls. Two balls are drawn sequentially WITHOUT replacement.
      What is the probability that both balls are red? Provide the answer as a decimal.
      End with "ANSWER: <number>" (can be decimal).
  metadata:
    category: mathematics
    subtype: dependent_probability
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // P(both red) = (5/8) * (4/7) = 5/14 = 0.357142857...
      // Tolerance allows a 4-decimal answer such as 0.3571
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 5/14) <= 1e-4;
- description: MA-05 hard - probability with conditional stages
  vars:
    input: |
      In a class of 30 students, 18 are girls and 12 are boys. If a student is selected at random,
      what is the probability that the student is a girl GIVEN that the student has long hair?
      Additional information: 12 girls have long hair, 4 boys have long hair.
      End with "ANSWER: <number>" (can be decimal).
  metadata:
    category: mathematics
    subtype: conditional_probability
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // P(girl | long hair) = P(girl and long hair) / P(long hair)
      // P(girl and long hair) = 12/30, P(long hair) = (12+4)/30 = 16/30
      // P(girl | long hair) = (12/30) / (16/30) = 12/16 = 3/4 = 0.75
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 0.75) <= 1e-6;
- description: MA-06 hard - boundary continuity with piecewise
  vars:
    input: |
      For the piecewise function to be continuous at x = 2:
      f(x) = x^2 + a, if x <= 2
      f(x) = bx + 3, if x > 2
 
      Find the value of 2b - a. End with "ANSWER: <number>" (digits only, can be negative).
  metadata:
    category: mathematics
    subtype: piecewise_continuity
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // At x = 2: 4 + a = 2b + 3 => 2b - a = 1
      const m = [...norm.matchAll(/ANSWER:\s*(-?\d+)/gi)].pop();
      return !!m && parseInt(m[1], 10) === 1;
