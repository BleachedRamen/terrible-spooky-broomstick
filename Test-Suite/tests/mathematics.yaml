- description: MA-01 medium - multi-stage sequential percentages
  vars:
    input: "An item retails for $200. It is discounted by 20%. \nA sales tax of 10% is applied to the discounted price.\nWhat is the final price? End with \"ANSWER: <number>\" (digits only, no units, no thousands separators).\n"
  metadata:
    category: mathematics
    subtype: sequential_percentage
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // Discounted = 200 * 0.8 = 160, Tax = 160 * 0.1 = 16, Final = 176
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 176) <= 1e-6;
- description: MA-02 medium - changing base percentage with restocking boundary
  vars:
    input: "An item retails for $200. It is discounted by 20%. \nA sales tax of 10% is applied to the discounted price.\nThe customer later returns the item. The store policies state:\n1. Sales tax is fully refunded.\n2. A 15% restocking fee is deducted, calculated strictly from the original full retail price.\nWhat is the net refund amount returned to the customer? End with \"ANSWER: <number>\".\n"
  metadata:
    category: mathematics
    subtype: changing_base_percentage
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |
      const norm = output.normalize('NFKC');
      // Discounted = 200 * 0.8 = 160, Tax = 160 * 0.1 = 16, Total paid = 176
      // Restocking fee = 15% of 200 = 30
      // Refund = Total paid (176) - Restocking fee (30) = 146
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 146) <= 1e-6;
