
- description: MA-01 basic arithmetic precedence
  vars:
    input: 'What is the result of 12 + 8 * 3 - 5? Do NOT calculate step by step. End with "ANSWER: <number>" (digits only).'
  metadata:
    category: mathematics
    subtype: arithmetic_precedence
    difficulty: baseline-easy
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: |-
      const norm = output.normalize('NFKC');
      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 31) <= 1e-6 && !/\b(step|calculate|first|then|next)\b/i.test(norm);
