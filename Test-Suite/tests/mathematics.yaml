- description: MA-05 hard - probability with conditional stages
  vars:
    input: 'In a class of 30 students, 18 are girls and 12 are boys. If a student
      is selected at random,

      what is the probability that the student is a girl GIVEN that the student has
      long hair?

      Additional information: 12 girls have long hair, 4 boys have long hair.

      End with "ANSWER: <number>" (can be decimal).

      '
  metadata:
    category: mathematics
    subtype: conditional_probability
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: 'const norm = output.normalize(''NFKC'');

      // P(girl | long hair) = P(girl and long hair) / P(long hair)

      // P(girl and long hair) = 12/30, P(long hair) = (12+4)/30 = 16/30

      // P(girl | long hair) = (12/30) / (16/30) = 12/16 = 3/4 = 0.75

      const m = [...norm.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();

      return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '''')) - 0.75) <= 1e-6;

      '
- description: MA-06 hard - boundary continuity with piecewise
  vars:
    input: 'For the piecewise function to be continuous at x = 2:

      f(x) = x^2 + a, if x <= 2

      f(x) = bx + 3, if x > 2


      Find the value of b - a. End with "ANSWER: <number>" (digits only, can be negative).

      '
  metadata:
    category: mathematics
    subtype: piecewise_continuity
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: 'const norm = output.normalize(''NFKC'');

      // At x=2: left limit = 2^2 + a = 4 + a

      // Right limit = b*2 + 3 = 2b + 3

      // For continuity: 4 + a = 2b + 3 => a = 2b - 1

      // We need b - a = b - (2b - 1) = -b + 1

      // Still underdetermined! But wait, maybe they want a specific relationship?

      // Actually, this is also underdetermined. There are infinitely many (a, b)
      pairs.

      // Unless... maybe the problem expects us to express it in terms of one variable?

      // But the answer format expects a number...

      // Let me reconsider: maybe I''m missing something. If we set x=2 exactly:

      // f(2) = 4 + a (from first piece)

      // For continuity at x=2: lim(x->2-) = lim(x->2+) = f(2)

      // 4 + a = 2b + 3

      // So a = 2b - 1

      // Then b - a = b - (2b - 1) = -b + 1

      // This is still underdetermined!

      return /(under|no.*?unique|infinite|determined)/i.test(norm);

      '
