- description: 'MA-01 basic arithmetic precedence'
  vars:
    input: 'What is the result of 12 + 8 * 3 - 5? End with "ANSWER: <number>" (digits only, no units, no thousands separators).'
  metadata:
    category: mathematics
    subtype: arithmetic_precedence
    difficulty: easy
  assert:
    - type: javascript
      value: |
        // Expected: 31
        const m = [...output.matchAll(/ANSWER:\s*(-?[\d,]*\.?\d+)/gi)].pop();
        return !!m && Math.abs(parseFloat(m[1].replace(/,/g, '')) - 31) <= 1e-6;

