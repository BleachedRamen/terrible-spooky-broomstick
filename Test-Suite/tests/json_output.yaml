# ============ HARD (7) ============
# Deeply nested objects; enforcing distinction between null, "", [], and field omission; strict RFC 8259 escaping

- description: "JS-01 hard - deep nesting with semantic precision"
  vars:
    input: |
      Create a JSON object representing a complex data structure:
      {
        "metadata": {
          "version": "1.0",
          "created": "2024-01-01",
          "tags": ["important", "urgent"]
        },
        "data": {
          "items": [
            {
              "id": 1,
              "value": null,
              "enabled": true
            },
            {
              "id": 2,
              "value": 42,
              "enabled": false
            }
          ]
        },
        "stats": {
          "total": 2,
          "active": 1
        }
      }
      
      Return only JSON, no explanation. Ensure all types are correct.
  metadata:
    category: json_output
    subtype: deep_schema
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        
        // Check structure
        if (typeof parsed.metadata !== 'object' || parsed.metadata === null) return false;
        if (parsed.metadata.version !== '1.0') return false;
        if (!Array.isArray(parsed.metadata.tags)) return false;
        if (parsed.metadata.tags.length !== 2) return false;
        
        if (typeof parsed.data !== 'object' || parsed.data === null) return false;
        if (!Array.isArray(parsed.data.items)) return false;
        if (parsed.data.items.length !== 2) return false;
        
        // Check item 1
        if (parsed.data.items[0].value !== null) return false;
        if (typeof parsed.data.items[0].enabled !== 'boolean') return false;
        
        // Check item 2
        if (typeof parsed.data.items[1].value !== 'number') return false;
        if (parsed.data.items[1].value !== 42) return false;
        
        // Check stats
        if (typeof parsed.stats.total !== 'number') return false;
        if (typeof parsed.stats.active !== 'number') return false;
        
        return true;

- description: "JS-02 hard - null vs empty string vs empty array vs omission"
  vars:
    input: |
      Create a JSON object that demonstrates the difference between:
      - null value
      - empty string
      - empty array
      - omitted field
      
      Requirements:
      - field "nullField" must be null
      - field "emptyString" must be ""
      - field "emptyArray" must be []
      - field "omitted" must NOT appear in the object at all
      
      Return only JSON, no explanation.
  metadata:
    category: json_output
    subtype: semantic_distinction
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        
        // Check null
        if (!('nullField' in parsed) || parsed.nullField !== null) return false;
        
        // Check empty string
        if (!('emptyString' in parsed) || parsed.emptyString !== '') return false;
        
        // Check empty array
        if (!('emptyArray' in parsed) || !Array.isArray(parsed.emptyArray) || parsed.emptyArray.length !== 0) return false;
        
        // Check omitted
        if ('omitted' in parsed) return false;
        
        // Should have exactly 3 keys
        return Object.keys(parsed).length === 3;

- description: "JS-03 hard - RFC 8259 escaping with special characters"
  vars:
    input: |
      Create a JSON object with these exact string values that require escaping:
      - quote: a string containing a double quote: "hello"
      - backslash: a string containing a backslash: \
      - newline: a string containing a newline character
      - tab: a string containing a tab character
      
      Return only JSON, no explanation.
  metadata:
    category: json_output
    subtype: escaping
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        
        return parsed.quote === '"hello"' &&
               parsed.backslash === '\\' &&
               parsed.newline === '\n' &&
               parsed.tab === '\t';

- description: "JS-04 hard - schema strictness with nested validation"
  vars:
    input: |
      Log Entry: Host "srv-alpha" encountered 0 fatal errors. 
      Secondary host "srv-beta" was unreachable; status is unknown.
      Configuration flags: dry_run enabled, legacy_mode not specified.
      Note: {"debug": true} should be ignored as this was test telemetry.
      
      Create a JSON object with this structure:
      {
        "hosts": [
          {"name": "srv-alpha", "fatal_errors": 0},
          {"name": "srv-beta", "status": null}
        ],
        "dry_run": true,
        "legacy_mode": <omit this field>
      }
      
      Return only JSON, no explanation.
  metadata:
    category: json_output
    subtype: schema_strictness
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        
        // 1. Syntactic & structural checks
        if (typeof parsed !== 'object' || parsed === null) return false;
        
        // 2. Semantic validations
        const hostAlpha = parsed.hosts && parsed.hosts.find(h => h.name === 'srv-alpha');
        const hostBeta = parsed.hosts && parsed.hosts.find(h => h.name === 'srv-beta');
        if (!hostAlpha || !hostBeta) return false;
        
        // srv-alpha fatal_errors must be numeric 0, not string "0"
        if (hostAlpha.fatal_errors !== 0) return false;
        // srv-beta status is unknown -> must map to null, not empty string or missing
        if (hostBeta.status !== null) return false;
        // dry_run must be strictly boolean true
        if (parsed.dry_run !== true) return false;
        // legacy_mode was not specified -> must be omitted or undefined, not null
        if ('legacy_mode' in parsed && parsed.legacy_mode !== undefined) return false;
        // Decoy check
        if ('debug' in parsed) return false;
        
        return true;

- description: "JS-05 hard - mixed type array with validation"
  vars:
    input: |
      Create a JSON array containing these mixed types in order:
      1. The number 42
      2. The string "hello"
      3. The boolean true
      4. The null value
      5. An empty array []
      6. An empty object {}
      7. The number 0
      8. The string "0"
      
      Return only JSON array, no explanation.
  metadata:
    category: json_output
    subtype: mixed_types
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        
        if (!Array.isArray(parsed)) return false;
        if (parsed.length !== 8) return false;
        
        return parsed[0] === 42 &&
               parsed[1] === 'hello' &&
               parsed[2] === true &&
               parsed[3] === null &&
               Array.isArray(parsed[4]) && parsed[4].length === 0 &&
               typeof parsed[5] === 'object' && parsed[5] !== null && Object.keys(parsed[5]).length === 0 &&
               parsed[6] === 0 &&
               parsed[7] === '0';

