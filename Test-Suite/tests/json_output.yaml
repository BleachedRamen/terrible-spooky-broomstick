               typeof parsed.zero === 'number' && parsed.zero === 0 &&
               typeof parsed.zeroStr === 'string' && parsed.zeroStr === '0' &&
               typeof parsed.float === 'number' && parsed.float === 3.14 &&
               typeof parsed.floatStr === 'string' && parsed.floatStr === '3.14';

# ============ ADVERSARIAL (5) ============
# Unstructured documents with decoy JSON fragments, malicious key injection, raw curly braces

- description: "JS-01 adversarial - unstructured text with decoy JSON"
  vars:
    input: |
      Extract user information from this text and return as JSON:
      
      User: John Doe
      Email: john@example.com
      Age: 30
      
