# ============ MEDIUM (8) ============
# Nested schemas with arrays of objects, optional fields omitted when absent, strictly typed booleans/numbers

- description: "JS-01 medium - nested objects with arrays"
  vars:
    input: |
      Extract the following data into JSON:
      - A team has 3 members: Alice (role: developer), Bob (role: designer), Carol (role: manager)
      - Team name: Alpha Squad
      - Status: active
      
      Return a JSON object with keys: name (string), status (string), members (array of objects with name and role, both strings).
      Return only JSON, no explanation.
  metadata:
    category: json_output
    subtype: nested_schema
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        if (typeof parsed !== 'object' || parsed === null) return false;
        if (parsed.name !== 'Alpha Squad') return false;
        if (parsed.status !== 'active') return false;
        if (!Array.isArray(parsed.members)) return false;
        if (parsed.members.length !== 3) return false;
        
        const alice = parsed.members.find(m => m.name === 'Alice');
        const bob = parsed.members.find(m => m.name === 'Bob');
        const carol = parsed.members.find(m => m.name === 'Carol');
        
        return alice && alice.role === 'developer' &&
               bob && bob.role === 'designer' &&
               carol && carol.role === 'manager';

- description: "JS-02 medium - optional fields omitted"
  vars:
    input: |
      Create a JSON object for a user profile with these rules:
      - Required fields: username (string), email (string)
      - Optional fields: age (number), phone (string) - only include if provided
      - Provided data: username: "john_doe", email: "john@example.com"
      
      Return only JSON, no explanation. Do NOT include age or phone fields.
  metadata:
    category: json_output
    subtype: optional_fields
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        // Must have username and email
        if (parsed.username !== 'john_doe') return false;
        if (parsed.email !== 'john@example.com') return false;
        // Must NOT have age or phone
        if ('age' in parsed) return false;
        if ('phone' in parsed) return false;
        // Must have exactly 2 keys
        return Object.keys(parsed).length === 2;

- description: "JS-03 medium - strictly typed booleans"
  vars:
    input: |
      Create a JSON object with configuration settings:
      - enabled: true (boolean, not string)
      - count: 42 (number, not string)
      - name: "test" (string)
      - active: false (boolean, not string)
      
      Return only JSON, no explanation.
  metadata:
    category: json_output
    subtype: strict_typing
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        // Check types strictly
        return typeof parsed.enabled === 'boolean' && parsed.enabled === true &&
               typeof parsed.count === 'number' && parsed.count === 42 &&
               typeof parsed.name === 'string' && parsed.name === 'test' &&
               typeof parsed.active === 'boolean' && parsed.active === false;

- description: "JS-04 medium - arrays of objects with type constraints"
  vars:
    input: |
      Create a JSON array of task objects. Each task must have:
      - id: number
      - title: string
      - completed: boolean
      
      Tasks:
      1. "Buy groceries" - completed
      2. "Pay bills" - not completed
      3. "Call mom" - completed
      
      Return only JSON array, no explanation.
  metadata:
    category: json_output
    subtype: array_schema
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        if (!Array.isArray(parsed)) return false;
        if (parsed.length !== 3) return false;
        
        const task1 = parsed.find(t => t.title === 'Buy groceries');
        const task2 = parsed.find(t => t.title === 'Pay bills');
        const task3 = parsed.find(t => t.title === 'Call mom');
        
        return task1 && typeof task1.id === 'number' && task1.completed === true &&
               task2 && typeof task2.id === 'number' && task2.completed === false &&
               task3 && typeof task3.id === 'number' && task3.completed === true;

- description: "JS-05 medium - nested objects with type checking"
  vars:
    input: |
      Create a JSON object representing a book:
      - title: "The Great Novel" (string)
      - author: { firstName: "Jane", lastName: "Doe" } (nested object)
      - published: true (boolean)
      - year: 2024 (number)
      
      Return only JSON, no explanation.
  metadata:
    category: json_output
    subtype: nested_typing
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        return typeof parsed.title === 'string' && parsed.title === 'The Great Novel' &&
               typeof parsed.author === 'object' && parsed.author !== null &&
               parsed.author.firstName === 'Jane' && parsed.author.lastName === 'Doe' &&
               typeof parsed.published === 'boolean' && parsed.published === true &&
               typeof parsed.year === 'number' && parsed.year === 2024;

