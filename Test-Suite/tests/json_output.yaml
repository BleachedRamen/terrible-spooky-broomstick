- description: JS-01 flat_object easy
  vars:
    input: 'From the sentence below, extract the stated details into one JSON object. Use these keys and types:
      assignee as a string, status as a string, and estimated_hours as an integer. Sentence: The work order is assigned
      to "Mara Venn", its status is "open", and the estimated hours are 6. Return only JSON, no explanation.'
  metadata:
    category: json_output
    subtype: flat_object
    difficulty: easy
  assert:
  - type: is-json
    value:
      type: object
      required:
      - assignee
      - status
      - estimated_hours
      properties:
        assignee:
          type: string
        status:
          type: string
        estimated_hours:
          type: integer
      additionalProperties: false
  - type: javascript
    value: |-
      const normalize = value => Array.isArray(value) ? value.map(normalize) : value && typeof value === "object" ? Object.fromEntries(Object.keys(value).sort().map(key => [key, normalize(value[key])])) : value;
      const deepEqual = (actual, expected) => JSON.stringify(normalize(actual)) === JSON.stringify(normalize(expected));
      const data = JSON.parse(output);
      return data["assignee"] === "Mara Venn" &&
        data["status"] === "open" &&
        data["estimated_hours"] === 6;
