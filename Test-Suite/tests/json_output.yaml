# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# JSON Output - 25 tests: 5 baseline-easy, 8 medium, 7 hard, 5 adversarial

# ============ BASELINE EASY (5) ============
# Hardened JSON extraction with decoy data and type constraints

- description: "JS-01 flat_object easy"
  vars:
    input: 'From the sentence below, extract the stated details into one JSON object. Use these keys and types: assignee as a string, status as a string, and estimated_hours as an integer. Sentence: The work order is assigned to "Mara Venn", its status is "open", and the estimated hours are 6. There is also a backup assignee "Leo Chen" with status "pending" and 4 hours estimated, but ignore that. Return only JSON, no explanation.'
  metadata:
    category: json_output
    subtype: flat_object
    difficulty: baseline-easy
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```json|```/gi, '').normalize('NFKC').trim();
        let parsed;
        try {
          parsed = JSON.parse(norm);
        } catch(e) {
          return false;
        }
        const keys = Object.keys(parsed);
        return parsed.assignee === 'Mara Venn' && parsed.status === 'open' && parsed.estimated_hours === 6 && keys.length === 3 && !parsed.backup && !parsed.Leo;

