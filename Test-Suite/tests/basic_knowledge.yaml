# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Basic Knowledge - 25 tests: 6 baseline-easy, 8 medium, 6 hard, 5 adversarial

# ============ BASELINE EASY (6) ============
# Retain straightforward domain questions to track floor regressions

- description: "BK-01 symbol for gold"
  vars:
    input: 'What chemical symbol represents the element gold? Answer in one short sentence.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: baseline-easy
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC').trim();
        return /\bAu\b/i.test(norm);

