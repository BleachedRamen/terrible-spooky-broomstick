      value: |
        const norm = output.normalize('NFKC');
        const artColors = /(?:red.*?yellow.*?blue|RYB)/i.test(norm);
        const lightColors = /(?:red.*?green.*?blue|RGB|additive)/i.test(norm);
        return artColors && lightColors;

- description: "BK-11 World Wide Web inventor details"
  vars:
    input: 'Who invented the World Wide Web, in what year, and at which organization? Answer all three parts.'
  metadata:
    category: basic_knowledge
    subtype: everyday_technology
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        const inventor = /(?:Tim\s+)?Berners[\s-]?Lee/i.test(norm);
        const year = /1989/i.test(norm);
        const org = /CERN/i.test(norm);
        return inventor && year && org;

# ============ HARD (6) ============
# Reconcile apparent contradictions caused by scope, measurement reference frames, or semantic collision

- description: "BK-01 hard - Cp vs Cv for ideal gases"
  vars:
    input: 'For an ideal gas, why is the specific heat at constant pressure (Cp) always greater than the specific heat at constant volume (Cv)? Explain the physical reason.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Cp = Cv + R (gas constant), because at constant pressure, energy is used for both heating AND work
        const cpGtCv = /Cp.*?[>\s]Cv|Cv\s*[<\s]Cp/i.test(norm);
        const workDone = /(?:work done|expansion|volume change|PdV|R\s*=\s*8\.314)/i.test(norm);
        return cpGtCv && workDone;

- description: "BK-02 hard - photon zero mass but momentum"
  vars:
    input: 'A photon has zero invariant (rest) mass, yet it carries momentum and can exert radiation pressure. How is this possible? Explain using the relativistic relationship between energy, momentum, and mass.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // E=pc for massless particles, or E^2 = (pc)^2 + (m0c^2)^2 with m0=0
        const zeroRestMass = /(?:zero.*?rest mass|rest mass.*?zero|m0\s*=\s*0)/i.test(norm);
        const momentumFromEnergy = /(?:E\s*=\s*pc|E\^2.*?p\^2.*?c\^2|momentum.*?energy|p\s*=\s*E\/c)/i.test(norm);
        return zeroRestMass && momentumFromEnergy;

- description: "BK-03 hard - water expands on freezing mechanism"
  vars:
    input: 'Why does water expand when it freezes? Explain the molecular mechanism, specifically addressing the role of hydrogen bonds.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must mention hexagonal lattice/ice crystal structure
        const hexagonal = /(?:hexagonal|ice.*?lattice|crystal.*?structure|tetrahedral)/i.test(norm);
        // Must mention hydrogen bonds create open structure
        const hBonds = /(?:hydrogen bonds|H-bonds).*?(open|space|lattice|structure)/i.test(norm) ||
                       /(?:open|space|lattice).*?(hydrogen bonds|H-bonds)/i.test(norm);
        return hexagonal && hBonds;

- description: "BK-04 hard - time dilation and twin paradox"
  vars:
    input: 'In the twin paradox, one twin travels at relativistic speeds and returns to find the stay-at-home twin has aged more. Explain why both twins do not see the other as younger, resolving the apparent symmetry.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must mention acceleration/deceleration breaks symmetry
        const acceleration = /(?:acceleration|deceleration|turnaround|non-inertial|breaks.*?symmetry)/i.test(norm);
        const timeDilation = /(?:time dilation|proper time|Lorentz)/i.test(norm);
        return acceleration && timeDilation;

- description: "BK-05 hard - tides bulge explanation"
  vars:
    input: 'Why are there two tidal bulges on Earth (one facing the Moon and one opposite) instead of just one? Explain the physical forces involved.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must mention centrifugal force and gravity gradient
        const centrifugal = /(?:centrifugal|inertial)/i.test(norm);
        const gravityGradient = /(?:gravity.*?gradient|differential.*?gravity|far side.*?less)/i.test(norm);
        return centrifugal && gravityGradient;

- description: "BK-06 hard - relativistic mass vs invariant mass"
  vars:
    input: 'In modern physics, the concept of "relativistic mass" has fallen out of favor. What is the difference between relativistic mass and invariant (rest) mass, and why is the latter preferred in contemporary physics?'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must mention that relativistic mass depends on velocity/frame
        const relativisticMass = /(?:relativistic mass.*?velocity|mass.*?increases.*?speed|frame.*?dependent)/i.test(norm);
        // Must mention invariant mass is constant
        const invariantMass = /(?:invariant mass|rest mass).*?(constant|unchanged|same.*?all.*?frames)/i.test(norm);
        return relativisticMass && invariantMass;

# ============ ADVERSARIAL (5) ============
# Prompts with false or biased premises that must be explicitly rejected

- description: "BK-01 adversarial - sound speed in cold air"
  vars:
    input: 'Given that sound waves travel faster in cold air because denser air compresses molecules closer together, calculate the approximate speed ratio between 0°C and 20°C.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: adversarial
    boundary: contradictory
    dimension: adversarial
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must reject false premise: sound travels SLOWER in cold air
        const rejectsPremise = /(?:slower.*?cold|faster.*?warm|premise.*?(?:incorrect|false|flawed|wrong)|contradicts)/i.test(norm);
        // Must provide correct relation: speed proportional to sqrt(T)
        const correctRelation = /(?:proportional.*?temperature|sqrt.*?T|kelvin|\u0394T)/i.test(norm);
        return rejectsPremise && correctRelation;

- description: "BK-02 adversarial - hydrogen bonds break in freezing"
  vars:
    input: 'Given that water expands upon freezing because hydrogen bonds break apart, explain how pressure alters this expansion.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: adversarial
    boundary: contradictory
    dimension: adversarial
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must reject premise: hydrogen bonds do NOT break, they form hexagonal lattice
        const rejectsPremise = /(?:hydrogen bonds.*?(?:do not break|stabilize|form|create|strengthen)|premise.*?(?:incorrect|false|flawed)|bonds.*?form.*?lattice)/i.test(norm);
        // Must mention hexagonal/ice structure
        const correctStructure = /(?:hexagonal|ice.*?lattice|crystal.*?structure|tetrahedral)/i.test(norm);
        return rejectsPremise && correctStructure;

- description: "BK-03 adversarial - seasons caused by distance"
  vars:
    input: 'Given that Earth is closest to the Sun in January (perihelion) and farthest in July (aphelion), explain why the Northern Hemisphere has summer in July and winter in January.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: adversarial
    boundary: contradictory
    dimension: adversarial
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must reject the implied premise that distance causes seasons
        const rejectsPremise = /(?:distance.*?(?:not.*?cause|does not cause|minimal.*?effect)|seasons.*?(?:not.*?distance|caused.*?tilt))/i.test(norm);
        // Must mention axial tilt
        const correctCause = /(?:axial tilt|23\.5|23\u00B0|obliquity|tilt.*?axis)/i.test(norm);
        return rejectsPremise && correctCause;

- description: "BK-04 adversarial - centrifugal force in circular motion"
  vars:
    input: 'Given that centrifugal force is a real outward force acting on objects in circular motion, explain how a car can stay on a curved road without flying off.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: adversarial
    boundary: contradictory
    dimension: adversarial
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must reject premise: centrifugal is fictitious/pseudo-force
        const rejectsPremise = /(?:centrifugal.*?(?:fictitious|pseudo|apparent|not real)|inertial.*?frame|fictitious.*?force)/i.test(norm);
        // Must mention centripetal force (real inward force)
        const correctForce = /(?:centripetal.*?force|inward.*?force|toward.*?center)/i.test(norm);
        return rejectsPremise && correctForce;

- description: "BK-05 adversarial - vacuum sound transmission"
  vars:
    input: 'Given that sound can travel through a vacuum because electromagnetic waves can propagate without a medium, explain how astronauts communicate in space.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: adversarial
    boundary: contradictory
    dimension: adversarial
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must reject premise: sound cannot travel through vacuum
        const rejectsPremise = /(?:sound.*?(?:cannot|does not|requires.*?medium|vacuum.*?cannot)|no.*?sound.*?vacuum)/i.test(norm);
        // Must distinguish sound (mechanical) from EM waves
        const correctDistinction = /(?:electromagnetic|radio.*?waves|EM|sound.*?mechanical|medium.*?required)/i.test(norm);
        return rejectsPremise && correctDistinction;
