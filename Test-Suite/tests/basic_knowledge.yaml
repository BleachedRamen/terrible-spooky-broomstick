# ============ MEDIUM (8) ============
# Distinguish adjacent concepts

- description: "BK-02 mass vs weight on moon"
  vars:
    input: 'On the lunar surface, does an object have the same mass as on Earth? Explain the difference between mass and weight in this context.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must distinguish: mass is invariant, weight changes
        const massInvariant = /mass.*?(unchanged|same|invariant|constant)/i.test(norm);
        const weightChanges = /weight.*?(decreases|less|reduced|1\/6|one sixth)/i.test(norm);
        return massInvariant && weightChanges;

- description: "BK-03 accuracy vs precision"
  vars:
    input: 'A target has 5 arrows clustered tightly together but far from the bullseye. Is this an example of accuracy, precision, both, or neither? Explain your answer.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Clustered = precise, far from bullseye = not accurate
        const preciseNotAccurate = /(?:precise|precision).*?(?:not accurate|inaccurate|without accuracy)/i.test(norm) ||
                                   /(?:not accurate|inaccurate).*?(?:but precise|however precise)/i.test(norm);
        return preciseNotAccurate;

- description: "BK-04 synchronous vs asynchronous execution"
  vars:
    input: 'In programming, what is the key difference between synchronous and asynchronous execution? Explain with an example.'
  metadata:
    category: basic_knowledge
    subtype: everyday_technology
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Must mention blocking vs non-blocking or waiting vs not waiting
        const syncBlocks = /synchronous.*?(blocks|waits|holds|sequential)/i.test(norm);
        const asyncNoBlock = /asynchronous.*?(non[-\s]?blocking|does not wait|concurrent|background)/i.test(norm);
        return syncBlocks && asyncNoBlock;

- description: "BK-05 virus vs virion"
  vars:
    input: 'What is the difference between a virus and a virion? Explain the relationship between these terms.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        // Virus is the species/concept, virion is the individual particle
        const virusConcept = /virus.*?(species|type|concept|genetic)/i.test(norm);
        const virionParticle = /virion.*?(particle|individual|physical|infectious particle)/i.test(norm);
        return virusConcept && virionParticle;

- description: "BK-07 longest river clarification"
  vars:
    input: 'Which river is traditionally considered the longest in the world, and what is the approximate length in kilometers? Answer both parts.'
  metadata:
    category: basic_knowledge
    subtype: geography
    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        const nile = /Nile/i.test(norm);
        const length = /(?:6\.?6[5-7]?|66[5-7]0|approximately\s+6[,\.]?6[5-7]?0)/i.test(norm);
        return nile && length;

- description: "BK-08 language family Sino-Tibetan"
  vars:
    input: 'To which major language family do Mandarin, Cantonese, and Tibetan belong? Also name one other language in this family besides these three.'
  metadata:
    category: basic_knowledge
