  vars:
    input: 'What chemical symbol represents the element gold? Answer in one short sentence.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: baseline-easy
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC').trim();
        return /\bAu\b/i.test(norm);

