    difficulty: medium
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC');
        const sinoTibetan = /Sino[\s-]?Tibetan/i.test(norm);
        const otherLang = /(?:Burmese|Tibetan|Nepali|Assamese|Bodo)/i.test(norm);
        return sinoTibetan && otherLang;

- description: "BK-09 primary colors art vs light"
  vars:
    input: 'What are the traditional primary colors in art (pigment mixing)? How do they differ from the primary colors in light (additive mixing)?'
  metadata:
