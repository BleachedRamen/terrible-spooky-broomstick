    input: 'What primary cellular function is performed by mitochondria? Answer in one short sentence.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: medium
  assert:
    - type: icontains-any
      value:
        - 'energy production'
        - 'ATP'
        - 'cellular respiration'

- description: 'BK-04 speed of light'
