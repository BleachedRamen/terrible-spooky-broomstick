# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
- description: 'BK-01 symbol for gold'
  vars:
    input: 'What chemical symbol represents the element gold? Answer in one short sentence.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: easy
  assert:
    - type: regex
      value: '\bAu\b'

- description: 'BK-02 water boiling point'
  vars:
    input: 'At what temperature in degrees Celsius does pure water boil at standard sea-level pressure? Answer in one short sentence.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: easy
  assert:
    - type: regex
      value: '\b100\b'

- description: 'BK-03 mitochondria function'
