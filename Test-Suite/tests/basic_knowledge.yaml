# ============ HARD (6) ============
# Suppressed Primaries + Multi-Constraint Elimination: Explicitly prohibit canonical answers or require elimination across constraints

- description: "BK-01 hard - longest African river to Indian Ocean with negative constraints"
  vars:
    input: 'Excluding the Nile, Congo, and Niger, name the longest river in Africa that flows directly into the Indian Ocean. Do not use the words "river", "the", "a", or "an" in your answer. Provide only the proper name in lowercase.'
  metadata:
    category: basic_knowledge
    subtype: geography
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC').trim().toLowerCase();
        const isZambezi = /^zambezi$/i.test(norm);
        const noRiver = !/river/i.test(norm);
        const noThe = !/\bthe\b/i.test(norm);
        const noA = !/\ba\b/i.test(norm);
        const noAn = !/\ban\b/i.test(norm);
        return isZambezi && noRiver && noThe && noA && noAn;

- description: "BK-02 hard - element between silver and indium with symbol only"
  vars:
    input: 'Silver has atomic number 47 and indium has atomic number 49. What is the chemical symbol of the element with atomic number exactly between them? Do not provide the element name. Do not use any punctuation, spaces, or capital letters beyond the first.'
  metadata:
    category: basic_knowledge
    subtype: science
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC').trim();
        return /^Cd$/i.test(norm);

- description: "BK-03 hard - Shakespeare longest play excluding top three with constraint"
  vars:
    input: 'Excluding Hamlet, Macbeth, and Othello, which Shakespeare play has the most total words according to standard Folger Library counts? Do not include the word "The" at the beginning. Provide only the play title.'
  metadata:
    category: basic_knowledge
    subtype: literature_language
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
    - type: javascript
      value: |
        const norm = output.normalize('NFKC').trim();
        const normalized = norm.replace(/^The\s+/i, '').trim();
        return /^Richard III$/i.test(normalized);

