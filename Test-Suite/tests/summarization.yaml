- description: SU-01 news_report short label
  vars:
    input: 'Summarize the following in at most 15 words and at most 1 sentence, including
      the key fact that the company reported record profits: "The company reported
      record profits of $100 million in Q1, beating all analyst expectations." Do
      NOT use the word "reported" or "profits".'
  metadata:
    category: summarization
    subtype: news_report
    difficulty: baseline-easy
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: 'const norm = output.replace(/<think>[\s\S]*?<\/think>/gi, '''').replace(/```[a-z]*|```/gi,
      '''').normalize(''NFKC'').trim();

      const words = norm.split(/\s+/).filter(Boolean).length;

      const sentences = norm.split(/(?<=[.!?])\s+/).filter(Boolean).length;

      const hasKeyFact = /(?:100.*?million|record.*?Q1|beat.*?expectations)/i.test(norm);

      return words <= 15 && sentences <= 1 && hasKeyFact && !/reported|profits/i.test(norm);'
