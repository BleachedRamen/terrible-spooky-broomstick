- description: 'SU-01 news_report short label'
  vars:
    input: |-
      Summarize the text between the triple quotes in at most 2 sentences and at most 40 words, including the cost ($4.2 million) and start date (March 14, 2027).
      """The municipal council of Oakhaven officially approved a $4.2 million infrastructure upgrade designed to replace aging water mains along Elm Street and prevent recurring winter freeze damage. Construction is scheduled to begin on March 14, 2027, and will continue for approximately six months under the supervision of Apex Engineering. Mayor Evelyn Vance announced during Tuesday's press conference that funding will be split evenly between state resilience grants and municipal bonds, avoiding any immediate property tax hikes for local residents."""
  metadata:
    category: summarization
    subtype: news_report
    difficulty: easy
  assert:
    - type: javascript
      value: |
        const text = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```[a-z]*|```/gi, '').normalize('NFKC').trim();
        const words = text.split(/\s+/).filter(Boolean).length;
        const sentences = text
          .replace(/\b(?:Dr|Mr|Mrs|Ms|Prof)\./gi, '')
          .replace(/\b([ap])\.m\.(?=\s+[a-z])/gi, '$1m')
          .split(/(?<=[.!?])\s+/)
          .filter(Boolean).length;
        return words <= 40 && sentences <= 2;
    - type: regex
      value: '(?:\$|USD\s*)?4\.2\s*million(?:\s*dollars)?|four\s+point\s+two\s+million\s+dollars?'
    - type: regex
      value: 'March\s+14(?:th)?,?\s+2027'
    - type: not-icontains
      value: 'bridge'
    - type: llm-rubric
      value: 'The summary contains only information present in the text in {{input}}. Score 1 if fully faithful, 0.5 if it contains one minor unsupported detail, 0 otherwise.'
      threshold: 0.5

