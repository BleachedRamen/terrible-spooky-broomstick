- description: 'SU-06 news_report short label'
  vars:
    input: |-
      Summarize the text between the triple quotes in at most 2 sentences and at most 40 words. Include the daily visitor permit limit (250) and the federal grant amount ($150,000).
      """Following months of stakeholder negotiations, the Department of Wildlife reopened the Pine Ridge Nature Reserve to eco-tourists, capping daily visitor permits at 250 individuals. Conservation officer Liam Gallagher explained that the temporary closure allowed local wolf populations to stabilize following a severe mange outbreak. Concurrently, neighboring landowners received $150,000 in federal grants to construct predator-proof fencing for livestock protection. State tourism boards project a 15% rebound in regional lodging bookings."""
  metadata:
    category: summarization
    subtype: news_report
    difficulty: hard
  assert:
    - type: javascript
      value: |
        const text = output.replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/```[\w-]*\s*/g, '').normalize('NFKC').trim();
        const words = text.split(/\s+/u).filter(Boolean).length;
        const sentences = text
          .replace(/\b(?:Mr|Mrs|Ms|Prof)\./gi, '')
          .replace(/\bU\.S\./gi, 'US')
          .replace(/\b([ap])\.m\.(?=\s+[a-z])/gi, '$1m')
          .split(/(?<=[.!?])\s+/)
          .filter(Boolean).length;
        return words <= 40 && sentences <= 2;
    - type: javascript
      value: |
        const text = output.normalize('NFKC').toLowerCase();
        return /\b250\b/.test(text) &&
        /\b(?:permits?|visitors?|individuals?|people|guests|daily cap|daily limit)\b/.test(text);
    - type: regex
      value: '(?:\$|USD\s*)?150,?000(?:\s*dollars)?|one\s+hundred\s+(?:and\s+)?fifty\s+thousand\s+dollars?'
    - type: not-icontains
      value: 'volcano'
    - type: llm-rubric
      value: |
        The summary must be factually faithful to the source. It must correctly state that Pine Ridge Nature Reserve reopened after a temporary closure related to a wolf mange outbreak, that daily visitor permits are limited to 250, and that neighboring landowners received $150,000 in federal grants for predator-proof livestock fencing. It may include other supported details, but must not introduce unsupported information or distort the events. Score 1 if all requirements are met, 0.5 if there is one minor omission or imprecision, and 0 if a key fact is incorrect or fabricated.
      threshold: 0.5

