      \ '').normalize('NFKC').trim();\nconst words = norm.split(/\\s+/).filter(Boolean).length;\n\
      const sentences = norm.split(/(?<=[.!?])\\s+/).filter(Boolean).length;\n// Must\
      \ preserve the non-finding\nconst hasNonFinding = /(?:no|not|did not).*?(mortality|hospitalization|death)/i.test(norm)\
      \ ||\n                      /(?:mortality|hospitalization).*?(no|not|none|no\
      \ effect)/i.test(norm);\nreturn words <= 40 && sentences <= 2 && hasNonFinding;\n"
