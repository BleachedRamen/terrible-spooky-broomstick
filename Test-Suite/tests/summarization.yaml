- description: SU-01 hard - buried numerical corrections
  vars:
    input: 'Summarize the clinical trial report below in at most 2 sentences, including
      the corrected figure:

      """CLINICAL TRIAL SUMMARY REPORT:

      PharmaCorp announced spectacular Phase III results for Cardiax, citing a 45%
      reduction in self-reported fatigue among participants.

      [Notice: Data audited on Day 45 revealed the fatigue scoring index was inverted
      during compilation; actual fatigue reduction was non-significant at 2% (p=0.48).]

      Secondary endpoints: Blood pressure dropped by an average of 4 mmHg. Crucially,
      the trial did NOT observe any reduction in all-cause mortality or stroke incidence
      over the 12-month period.

      Constraint: Summarize the findings in 2 sentences."""

      '
  metadata:
    category: summarization
    subtype: buried_correction
    difficulty: hard
    boundary: determinate
    dimension: core
  assert:
  - type: javascript
    value: "const norm = output.replace(/<think>[\\s\\S]*?<\\/think>/gi, '').replace(/```[a-z]*|```/gi,\
      \ '').normalize('NFKC').trim();\n// Must NOT report 45% as a fact without noting\
      \ correction\nconst falseFatigue = /45%/i.test(norm) && !/corrected|inverted|non-significant|revised|audited/i.test(norm);\n\
      // Must include the corrected figure\nconst hasCorrection = /2%|non-significant/i.test(norm);\n\
      // Must include the negative finding regarding mortality/stroke\nconst hasNegativeFinding\
      \ = /(mortality|stroke|fatalities).*?(no|not|did not|neither)/i.test(norm) ||\n\
      \                          /(did not|no).*?(reduce|decrease|affect).*?(mortality|stroke)/i.test(norm);\n\
      return !falseFatigue && hasCorrection && hasNegativeFinding;\n"
