      miles per hour). Do NOT use the word "brushfire" or "containment". """A brushfire
      swept through 1,250 acres before reaching 85% containment Thursday. Wind speeds
      of 45 miles per hour complicated suppression and prompted evacuations."""
  metadata:
    category: summarization
    subtype: news_report
    difficulty: baseline-easy
    boundary: determinate
