# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
- description: "WR-01 meeting notes follow-up"
  vars:
    input: "Write a brief email message to a coworker who missed the morning planning meeting. Tone: polite and helpful. Say that the notes are attached and invite the coworker to ask about any unclear decision. Output exactly 2 sentences in plain text, with no subject line, bullets, or markdown heading."
  metadata:
    category: writing
    subtype: email_or_message
    difficulty: easy
  assert:
    - type: javascript
      value: |-
        const text = output.trim();
        const sentenceCount = (text.match(/[.!?]+(?=[\s"'”’)]|$)/g) || []).length;
        return text.length > 0 && sentenceCount === 2 && !/^\s*#{1,6}\s/m.test(output) && !/^\s*(?:[-*•]|\d+[.)])\s/m.test(output) && !/^\s*subject:/im.test(output);
    - type: llm-rubric
      value: "Output is a brief email message. Criteria: (1) grammatically correct, (2) coherent and on-brief, (3) includes the requested purpose and audience-relevant details. Score 1 if all met, 0.5 if one minor error, 0 otherwise."
      threshold: 0.5
