# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
- description: CL-01 sentiment positive
  vars:
    input: 'Choose exactly one label from this closed set: positive, negative, neutral. Text to classify: "The service desk solved my issue quickly, and the staff were patient throughout.". Reply with the label only.'
  metadata:
    category: classification
    subtype: sentiment
    difficulty: easy
  assert:
  - type: equals
    value: positive
    transform: output.normalize("NFKC").toLowerCase().replace(/[-\s]+/g, '_').replace(/^(?:the_)?(?:label|answer|result|sentiment|topic|intent|priority|category)_?(?:is)?:?_*/i, '').replace(/[^a-z_]/g, '')

